services:
  flight-db:
    image: postgres:15
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flight_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  hotel-db:
    image: postgres:15
    environment:
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_DB: hotel_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  car-db:
    image: postgres:15
    environment:
      POSTGRES_USER: car
      POSTGRES_PASSWORD: car
      POSTGRES_DB: car_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car -d car_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  flight-service:
    build: ./flight-service
    environment:
      DATABASE_URL: postgresql://flight:flight@flight-db:5432/flight_db
    depends_on:
      flight-db:
        condition: service_healthy
    ports:
      - "8001:8000"

  hotel-service:
    build: ./hotel-service
    environment:
      DATABASE_URL: postgresql://hotel:hotel@hotel-db:5432/hotel_db
    depends_on:
      hotel-db:
        condition: service_healthy
    ports:
      - "8002:8000"

  car-service:
    build: ./car-service
    environment:
      DATABASE_URL: postgresql://car:car@car-db:5432/car_db
    depends_on:
      car-db:
        condition: service_healthy
    ports:
      - "8003:8000"

  trip-service:
    build: ./trip-service
    environment:
      FLIGHT_URL: http://flight-service:8000
      HOTEL_URL: http://hotel-service:8000
      CAR_URL: http://car-service:8000
    depends_on:
      - flight-service
      - hotel-service
      - car-service
    ports:
      - "8000:8000"